name: Corregir imagen de eventos en galería

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reemplazar última imagen externa
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'src="https://images.unsplash.com/photo-1600891964092-4316c288032e?q=80&w=2070&auto=format&fit=crop"'
          new = 'src="galeria/galeria-01.avif"'
          if old not in s:
              raise SystemExit('La imagen externa esperada ya no está presente')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambios y retirar workflow temporal
        run: |
          rm -f .github/workflows/fix-gallery-event.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reemplazar imagen externa restante de galería"
          git push origin HEAD:main
