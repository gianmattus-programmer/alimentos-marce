name: Ajustar vista previa de galería

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar imágenes y títulos
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('gallery-viewer.js')
          s = p.read_text(encoding='utf-8')
          old = """  const PREVIEW = [
              { src: 'galeria/galeria-01.avif', label: 'Menú Ejecutivo' },
              { src: 'galeria/galeria-07.avif', label: 'Línea Saludable' },
              { src: 'galeria/galeria-11.avif', label: 'Coffee Break' },
              { src: 'galeria/galeria-30.avif', label: 'Eventos Especiales y Almuerzos de Confraternidad' }
            ];"""
          new = """  const PREVIEW = [
              { src: 'galeria/galeria-02.avif', label: 'Servicio de Alimentación' },
              { src: 'galeria/galeria-28.avif', label: 'Almuerzo Corporativo' },
              { src: 'galeria/galeria-22.avif', label: 'Coffee Break' },
              { src: 'galeria/galeria-18.avif', label: 'Menús Especiales' }
            ];"""
          if old not in s:
              old = """  const PREVIEW = [
    { src: 'galeria/galeria-01.avif', label: 'Menú Ejecutivo' },
    { src: 'galeria/galeria-07.avif', label: 'Línea Saludable' },
    { src: 'galeria/galeria-11.avif', label: 'Coffee Break' },
    { src: 'galeria/galeria-30.avif', label: 'Eventos Especiales y Almuerzos de Confraternidad' }
  ];"""
              new = """  const PREVIEW = [
    { src: 'galeria/galeria-02.avif', label: 'Servicio de Alimentación' },
    { src: 'galeria/galeria-28.avif', label: 'Almuerzo Corporativo' },
    { src: 'galeria/galeria-22.avif', label: 'Coffee Break' },
    { src: 'galeria/galeria-18.avif', label: 'Menús Especiales' }
  ];"""
          if old not in s:
              raise SystemExit('No se encontró el bloque PREVIEW esperado')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/refine-gallery-preview.yml
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-viewer.js .github/workflows/refine-gallery-preview.yml
          git commit -m "Refinar vista previa de galería" || exit 0
          git push
