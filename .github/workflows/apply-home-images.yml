name: Aplicar imágenes de Alimentos Marce

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar imágenes de la página principal
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          replacements = {
              'src="galeria/galeria-28.avif" alt="Menú delivery corporativo para empresas"':
                  'src="servicios/menu-delivery.avif" alt="Menú delivery corporativo para empresas"',
              'src="https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=2069&auto=format&fit=crop"':
                  'src="galeria/galeria-12.avif"',
              'src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?q=80&w=2070&auto=format&fit=crop"':
                  'src="galeria/galeria-28.avif"',
              'src="https://images.unsplash.com/photo-1559847844-5315695dadae?q=80&w=2058&auto=format&fit=crop"':
                  'src="galeria/galeria-13.avif"',
              'src="https://images.unsplash.com/photo-1600891964092-4316c288032e?q=80&w=2070&auto=format&fit=crop"':
                  'src="galeria/galeria-01.avif"',
              '<!-- CSS Grid Masonry Look: conserva las imágenes anteriores -->':
                  '<!-- CSS Grid Masonry Look: imágenes reales de la galería de Alimentos Marce -->',
          }

          missing = [old for old in replacements if old not in html]
          if missing:
              raise SystemExit('No se encontraron patrones esperados: ' + repr(missing))

          for old, new in replacements.items():
              html = html.replace(old, new, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Retirar workflow temporal y guardar cambios
        run: |
          rm -f .github/workflows/apply-home-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar Menú Delivery y galería con imágenes propias"
            git push origin HEAD:main
          fi
