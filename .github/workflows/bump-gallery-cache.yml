name: Actualizar cache galeria responsive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar version del visor
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('gallery-viewer.js?v=1', 'gallery-viewer.js?v=2')
          if s2 == s and 'gallery-viewer.js?v=2' not in s:
              raise SystemExit('No se encontro la referencia esperada al visor')
          p.write_text(s2, encoding='utf-8')
          PY
          rm -f .github/workflows/bump-gallery-cache.yml
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/bump-gallery-cache.yml
          git commit -m "Actualizar cache de galeria responsive" || exit 0
          git push
