          curl -fsSL --retry 3 'https://cdn.shopify.com/s/files/1/0744/6305/1865/files/marce-gallery-desktop-29.avif?v=1787792063' -o galeria/desktop/galeria-29.avif
          curl -fsSL --retry 3 'https://cdn.shopify.com/s/files/1/0744/6305/1865/files/marce-gallery-desktop-30.avif?v=1787792073' -o galeria/desktop/galeria-30.avif
          curl -fsSL --retry 3 'https://cdn.shopify.com/s/files/1/0744/6305/1865/files/marce-gallery-desktop-31.avif?v=1787792084' -o galeria/desktop/galeria-31.avif
          python gallery-responsive-build.py
          rm -f gallery-responsive-build.py .github/workflows/build-responsive-gallery.yml

      - name: Guardar galería responsive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add galeria/mobile galeria/desktop gallery-viewer.js gallery-responsive-build.py .github/workflows/build-responsive-gallery.yml
          git commit -m "Separar imágenes de galería para desktop y mobile" || exit 0
          git push
