          curl -fsSL --retry 3 'https://cdn.shopify.com/s/files/1/0744/6305/1865/files/marce-gallery-desktop-22.avif?v=1787792004' -o galeria/desktop/galeria-22.avif
          curl -fsSL --retry 3 'https://cdn.shopify.com/s/files/1/0744/6305/1865/files/marce-gallery-desktop-23.avif?v=1787792017' -o galeria/desktop/galeria-23.avif
          curl -fsSL --retry 3 'https://cdn.shopify.com/s/files/1/0744/6305/1865/files/marce-gallery-desktop-24.avif?v=1787792025' -o galeria/desktop/galeria-24.avif
          curl -fsSL --retry 3 'https://cdn.shopify.com/s/files/1/0744/6305/1865/files/marce-gallery-desktop-25.avif?v=1787792034' -o galeria/desktop/galeria-25.avif
